[project]
name = "bess-pcs-agent"
version = "0.1.0"
description = "BESS PCS troubleshooting agent"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "pyyaml>=6",
    "chromadb>=1.0",
    "rank-bm25>=0.2.2",
]

[project.optional-dependencies]
dev = ["pytest>=8", "respx>=0.21"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["llm", "kb", "privacy", "tools"]
py-modules = ["retrieval"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
